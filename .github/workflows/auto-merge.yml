name: Safe Auto Merge to Main
on:
  push:
    branches: [nhat, phu, thanh, tung]
permissions:
  contents: write
concurrency:
  group: backend-auto-merge
  cancel-in-progress: false
jobs:
  validate-and-merge:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: feelingtrip_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:test@localhost:5432/feelingtrip_test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Test pushed commit
        working-directory: backend
        run: |
          npm ci --legacy-peer-deps
          npm run check
          npm test
      - name: Merge the tested commit into current main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B main origin/main
          git merge --no-ff "${{ github.sha }}" -m "ci: auto-merge ${{ github.ref_name }} into main [skip ci]"
      - name: Test merged result
        working-directory: backend
        run: |
          npm ci --legacy-peer-deps
          npm run check
          npm test
      - name: Push validated main
        run: git push origin main
