<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Koharu Pixel Animations</title><style>body{background:#e9eef4;color:#24344a;font:16px system-ui;max-width:900px;margin:32px auto;padding:20px}h1{font-size:28px}button{padding:10px;margin:4px;border:1px solid #b2c6d5;border-radius:9px;background:white;cursor:pointer}button.active{background:#a9deda}canvas{display:block;margin:28px auto;image-rendering:pixelated;background:repeating-conic-gradient(#e6e9ee 0% 25%,#fff 0% 50%) 0/24px 24px;border-radius:12px}label{margin:12px}img{max-width:100%}</style><h1>Koharu · Pixel animation pack</h1><p>7 animations · 28 frames · transparent PNG · 96 × 112 px/frame</p><div id="buttons"></div><canvas id="screen" width="288" height="336"></canvas><label>Speed <input id="speed" type="range" min="0.5" max="2" value="1" step="0.1"></label><button id="pause">Pause</button><p id="status"></p><details><summary>All frames</summary><img src="previews/contact-sheet.png"></details><script>
const names=['idle','welcome','point_left','point_up','talking','success','explain'];let row=0,frame=0,playing=true,last=0;const image=new Image();image.src='spritesheets/koharu_all.png';const ctx=document.querySelector('canvas').getContext('2d');ctx.imageSmoothingEnabled=false;function draw(){ctx.clearRect(0,0,288,336);if(image.complete)ctx.drawImage(image,frame*96,row*112,96,112,0,0,288,336);document.querySelector('#status').textContent='koharu_'+names[row]+' · frame '+frame+' / 3'}names.forEach((n,i)=>{const b=document.createElement('button');b.textContent=n;b.onclick=()=>{row=i;frame=0;last=0;document.querySelectorAll('#buttons button').forEach(x=>x.classList.remove('active'));b.classList.add('active');draw()};document.querySelector('#buttons').append(b)});document.querySelector('#buttons button').classList.add('active');document.querySelector('#pause').onclick=e=>{playing=!playing;e.target.textContent=playing?'Pause':'Play'};function tick(t){const durations=row===0?[450,180,180,450]:[220,220,220,220];if(playing&&t-last>durations[frame]/Number(document.querySelector('#speed').value)){frame=(frame+1)%4;last=t;draw()}requestAnimationFrame(tick)}image.onload=draw;requestAnimationFrame(tick);
</script></html>
